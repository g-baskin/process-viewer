[package]
name = "process-app"
version = "0.1.0"
description = "See what's running on your Mac, who started it, and stop it."
license = "MIT"
edition = "2021"
rust-version = "1.90"
resolver = "3"

[lib]
name = "process_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = "0.37"
base64 = "0.22"
plist = "1"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = "0.3"
objc2-foundation = "0.3"

[profile.release]
strip = true
